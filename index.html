<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>熱血目的整理ゲーム｜目的から逃げるな！</title>
  <style>
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #151515, #2b1a1a 45%, #111);
      color: #fff;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(10px, 2.5vw, 24px);
      overflow-x: hidden;
    }
    .game {
      width: min(1020px, 100%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: clamp(16px, 3vw, 24px);
      padding: clamp(14px, 3vw, 24px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: clamp(12px, 2vw, 18px);
    }
    h1 {
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1.15;
      margin: 0;
      letter-spacing: 0.03em;
    }
    .badge {
      background: #ffd84d;
      color: #211700;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 0 #9b7300;
      font-size: clamp(12px, 2vw, 15px);
    }
    .mentor-area {
      display: grid;
      grid-template-columns: minmax(150px, 190px) 1fr;
      gap: clamp(12px, 2.5vw, 18px);
      align-items: stretch;
    }
    .mentor {
      background: linear-gradient(180deg, #2b2b2b, #111);
      border-radius: 20px;
      padding: clamp(10px, 2vw, 14px);
      border: 2px solid rgba(255,255,255,0.16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 230px;
      position: relative;
      overflow: hidden;
    }
    .mentor::before {
      content: "喝";
      position: absolute;
      font-size: clamp(82px, 13vw, 120px);
      font-weight: 900;
      opacity: 0.08;
      transform: rotate(-18deg);
    }
    .face {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #ffe1bd, #d18a55 65%, #7b3f1e);
      border: 4px solid #fff;
      position: relative;
      z-index: 1;
    }
    .face::before, .face::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 8px;
      background: #1a120d;
      top: 44px;
      border-radius: 8px;
    }
    .face::before { left: 30px; transform: rotate(18deg); }
    .face::after { right: 30px; transform: rotate(-18deg); }
    .mouth {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      width: 42px;
      height: 16px;
      border-radius: 0 0 24px 24px;
      background: #3b100c;
    }
    .character-img {
      width: clamp(108px, 18vw, 150px);
      height: clamp(108px, 18vw, 150px);
      object-fit: cover;
      object-position: center;
      border-radius: 22px;
      border: 4px solid #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
      z-index: 1;
      background: #fff;
    }
    .mentor-name {
      z-index: 1;
      margin-top: 12px;
      font-weight: 900;
      color: #ffd84d;
      text-align: center;
      font-size: clamp(13px, 2.5vw, 16px);
      line-height: 1.35;
    }
    .panel {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: clamp(14px, 2.8vw, 20px);
      min-height: 230px;
    }
    .scene-label {
      display: inline-block;
      font-size: clamp(12px, 2vw, 13px);
      color: #ffd84d;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .question {
      font-size: clamp(18px, 3.4vw, 25px);
      font-weight: 900;
      line-height: 1.45;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }
    .hint {
      color: #ddd;
      line-height: 1.65;
      margin-bottom: 12px;
      font-size: clamp(14px, 2.8vw, 16px);
      overflow-wrap: anywhere;
      display: none;
      background: rgba(255, 216, 77, 0.1);
      border: 1px solid rgba(255, 216, 77, 0.25);
      border-radius: 14px;
      padding: 12px;
    }
    .hint-btn {
      background: rgba(255, 216, 77, 0.16);
      color: #ffd84d;
      border: 1px solid rgba(255, 216, 77, 0.35);
      box-shadow: none;
      width: 100%;
      margin-bottom: 14px;
      min-height: 44px;
    }
    .hint-btn.used {
      opacity: 0.65;
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: clamp(15px, 3.4vw, 16px);
      line-height: 1.5;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(2px); }
    button:disabled {
      cursor: default;
      opacity: 0.92;
    }
    .choice {
      text-align: left;
      background: #f2f2f2;
      color: #151515;
      box-shadow: 0 4px 0 #aaa;
      width: 100%;
      min-height: 52px;
      overflow-wrap: anywhere;
    }
    .choice.correct { background: #d9ffe5; }
    .choice.wrong { background: #ffe1e1; }
    .message {
      margin-top: 16px;
      padding: clamp(14px, 2.8vw, 18px);
      border-radius: 18px;
      min-height: 92px;
      line-height: 1.7;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: clamp(14px, 2.9vw, 16px);
      overflow-wrap: anywhere;
    }
    .scold {
      font-size: clamp(18px, 4.6vw, 27px);
      font-weight: 900;
      color: #ff7878;
      text-shadow: 0 2px 0 rgba(0,0,0,0.4);
      line-height: 1.45;
    }
    .praise {
      font-size: clamp(18px, 4.6vw, 28px);
      font-weight: 900;
      color: #8dffb0;
      line-height: 1.45;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: clamp(10px, 2.2vw, 12px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: clamp(12px, 2.5vw, 15px);
    }
    .stat b {
      display: block;
      font-size: clamp(20px, 5vw, 24px);
      color: #ffd84d;
      line-height: 1.2;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .actions button {
      min-height: 50px;
      flex: 1 1 180px;
      text-align: center;
    }
    .next { background: #ffd84d; color: #1b1300; box-shadow: 0 5px 0 #9b7300; }
    .reset { background: #555; color: #fff; box-shadow: 0 5px 0 #222; }
    .sound { background: #333; color: #ffd84d; box-shadow: 0 5px 0 #111; border: 1px solid rgba(255,216,77,0.35); }
    .sound.off { color: #ddd; background: #444; }
    .small-note {
      color: #cfcfcf;
      font-size: clamp(11px, 2.4vw, 12px);
      line-height: 1.6;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
    .shake { animation: shake 0.22s linear 2; }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }
    .flash { animation: flash 0.35s ease; }
    @keyframes flash {
      0% { background: rgba(255,0,0,0.35); }
      100% { background: rgba(255,255,255,0.08); }
    }

    @media (hover: none) {
      button:hover { filter: none; }
    }

    @media (max-width: 760px) {
      body {
        align-items: flex-start;
        padding: 10px;
      }
      .top {
        align-items: flex-start;
        flex-direction: column;
      }
      .badge {
        align-self: flex-start;
      }
      .mentor-area {
        grid-template-columns: 1fr;
      }
      .mentor {
        min-height: auto;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
      }
      .mentor::before {
        right: 16px;
        font-size: 88px;
      }
      .character-img {
        flex: 0 0 auto;
        width: 92px;
        height: 92px;
        border-radius: 18px;
      }
      .mentor-name {
        margin-top: 0;
        text-align: left;
      }
      .panel {
        min-height: auto;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .actions {
        position: sticky;
        bottom: 8px;
        z-index: 10;
        background: rgba(20, 20, 20, 0.76);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        padding: 8px;
        backdrop-filter: blur(8px);
      }
      .actions button {
        flex: 1 1 120px;
        padding: 12px 10px;
      }
    }

    @media (max-width: 420px) {
      .game {
        border-radius: 14px;
        padding: 12px;
      }
      .mentor {
        padding: 10px;
      }
      .character-img {
        width: 78px;
        height: 78px;
        border-width: 3px;
      }
      .question {
        font-size: 17px;
      }
      .choice {
        padding: 13px 12px;
      }
      .stats {
        gap: 8px;
      }
      .stat {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="top">
      <h1>熱血目的整理ゲーム<br>目的から逃げるな！</h1>
      <div class="badge">全ジャンル対応・強化版</div>
    </div>

    <section class="mentor-area">
      <div class="mentor" id="mentor">
        <img class="character-img" src="character.png" alt="熱血メンターのゲームキャラクター" />
        <div class="mentor-name">熱血メンター<br>キタハラ</div>
      </div>

      <div class="panel" id="panel">
        <span class="scene-label" id="sceneLabel">相談 1</span>
        <div class="question" id="question"></div>
        <div class="hint" id="hint"></div>
        <button class="hint-btn" id="hintBtn" type="button">ヒントを見る（信頼度 -5）</button>
        <div class="choices" id="choices"></div>
        <div class="message" id="message">選択肢を選ぶと、メンターが即フィードバックします。</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat">正解数<b id="score">0</b></div>
      <div class="stat">叱られ数<b id="miss">0</b></div>
      <div class="stat">信頼度<b id="trust">50</b></div>
      <div class="stat">相談数<b id="progress">1/50</b></div>
    </section>

    <div class="actions">
      <button class="next" id="nextBtn">次の相談へ</button>
      <button class="reset" id="resetBtn">最初からやり直す</button>
      <button class="sound" id="soundBtn" type="button">サウンド ON</button>
    </div>

    <p class="small-note">
      ※このゲームは、仕事・創作・営業・イベント・勉強・副業・組織づくり・人間関係などに使える「目的設定」「課題整理」「具体化」「戦略設計」「未来設計」「人との向き合い方」を学ぶためのフィクション作品です。実在人物をそのまま再現するものではありません。
    </p>
  </main>

  <script>
    const scoldLines = [
      "目的を言わなきゃだめじゃん。",
      "やること自体が目的になっとる。",
      "違うよ。目的から逆算しないと課題を理解してないのよ。",
      "課題を捉えるってことがすごく大事なの。",
      "課題に対して甘すぎないっていう。",
      "考える力が弱いのよ。浅いのよ、考え方が。",
      "全部感覚ないよ。話してて。",
      "下手くそだな。",
      "具体性がないから方向定まらないんよ。",
      "具体性がないから、とりあえずSNSアカウント作ってみようかな、みたいなところから入っちゃうんよ。",
      "未来が見えないのよ。ここを描いてかないと、ただの数字になっちゃうの。",
      "目標がないんだよね。具体的な目標、数値ベースの目標がないのよ。",
      "ずっと気持ちとか感覚とか思いの話ばっかりになっちゃうんだよね。",
      "感覚でふわっと社会貢献とかっていう言葉にしか出力できてないのよ。だから先に進めない。",
      "SNSやりすぎ病ね。素敵なんだけどね。本当にね。",
      "ビジネスを博打にしちゃだめよ。",
      "コンサルティング勘違いしてんだよね。マネタイズ効率最大化の話じゃないんだよ。",
      "続ける理由がなくなってくるんよ。出すなって話を。",
      "届け先に対して自分の価値を間違ってぶつけてないかっていうことよ。",
      "どんな環境でも伸びるやつは伸びるんやって。",
      "思考の部分ですからね。思考変えなきゃいけないね。",
      "甘えるだろ。",
      "うまくいかない人たちなんか自分のことしか考えないよ。以上になります。",
      "本気出したのいつ？って。なんでこれを今って言えないの？",
      "話のテクニックなんかいくらでもあるよ。大事なのは本人に気づかせるってことよ。",
      "会話ができないんですよ。ざっくりしすぎじゃないですか。",
      "確認作業が少なすぎるってことよ。",
      "行き当たりばったりで課題これかもって思いつきで動いてる。",
      "アウトプットが少なすぎるんよ。",
      "全部は準備力です。",
      "自分のことでしょ。ちゃんと把握しようよ。",
      "理解が低すぎないかってことよ。",
      "数字すら言えない。説明できない。チャンス逃すってことじゃん。",
      "自分の問題を問題として捉えてないんよ。",
      "感情で止まるんじゃなくて、次の行動を決めよう。",
      "悲劇のヒロインモードに入ってたやん。",
      "もう本気でやるんだろ。",
      "強くなりましょうよ。誰がついてきたいんだって。",
      "ついてきたくなるような振る舞いしろやってことよ。",
      "将来的な新商品などの試作って、別に社内で研究する必要なくないってことになってくるんだよ。",
      "会社のナレッジを貯めなきゃいけないことって何なのか、胴元を抑えられるものが何なのかってことに目印を置かなきゃいけない。",
      "その研究機関が何を研究し続ける会社なのかで、会社の出口未来を決めておけってことよ。",
      "じゃないと、売上目指すぞっていうだけの組織になる。",
      "全員をこれで繋げなきゃいけないの。全部を。",
      "どういう大義や目標を置けば、寝る間も惜しんで考えるモードになれるのかなってことよ。",
      "点と点でしか考えてないのよ。",
      "紹介が多い人達って、俺の後ろの人間のことまで気使ってくれるんよ。",
      "回答としては届きません。",
      "AIで人との交差する瞬間すらもスキップするやつがいるんよ。だから売れんくなるんよ。",
      "AIでしていいところと、しちゃいけないところがある。",
      "人と接触するところは、人間の熱を入れなきゃいけん。",
      "それを全部スキップしようとする脳みそやから、繋がってないんやって。",
      "今1人1人を貴重にしなきゃいけない時期やろ。",
      "プレゼント企画とか言ってばらまいてるからだよ。",
      "ティッシュ配りで受け取った人の顔、覚えとるか？",
      "忘れられてる生き方しとんじゃないの？",
      "簡略化するからや。",
      "結果としてそんなんでチーム作ってみ。めちゃくちゃ弱いや、そのチームは。",
      "人と繋がる力が弱い。",
      "特に聞きたいことはないです、で終わってたらここまで話さないわな。",
      "だから頑張って質問するんよ。",
      "全然生き方が甘い。",
      "優先順位は家族をまず1位にしてください。",
      "何のために稼ぐんですか？お金を。",
      "何のために世の中から可愛がられるんですか？",
      "違うよ。自分のやりたいことやっとるから誰からも可愛がられないねん。",
      "守りたい人を守るために稼ぐんやろ。",
      "お金の定義から変えてけ。金の定義から。",
      "大切な人を守るために金はあんの。",
      "お金に1mmも愛が乗ってないの。",
      "全部自分じゃねえかよ。",
      "誰がお前のやりたいことを応援する、その生き方で。",
      "自分が周りのために全部使うから、周りも自分のために使ってくれるんやって。",
      "種まいてんや。種を。全部自分本位やん。",
      "家族に聞かれた時に、優先順位は家族が2位ですってなったら家族気持ちいいか？",
      "敵をわざわざ内部に作んな。",
      "舐めた生き方してんなや。",
      "周りの人間を舐め腐った生き方すんなやってことや。",
      "表現気をつけろ、表現を。",
      "自分のために頑張り続けられる人間なんかいないから、家族ともっと話せ。",
      "今作業としてやってるやろ。育児を。",
      "どうやったら家族が楽になるのかなって考えて立ち回るんよ。",
      "仕事に一生懸命になった時に、昔の方が良かったなんて言われちゃだめよ。",
      "そこを全部持ってないと人なんて来ねえよ。",
      "ギブは基本毎日しろ、誰かに。必ず内と外に。",
      "1ヶ月に2回は少ない。毎日誰かにギブ。",
      "バズる投稿を作ろうとか、この時期でしかないんよ。瞬間なんよ。",
      "長期繁栄、次の世代まで、その次の世代までの長期繁栄を作れ。",
      "そういう生き方を子供に教えてけ。",
      "とにかく人集めろ。勉強会しろ。持ってるもの出してけ。",
      "なんでやらないの？いくらでもできるやん。",
      "考え方変えな、生き方変えな、習慣変えなってこと。",
      "相手にとっての5位、もしくは8位の中に入る生き方しとるか。",
      "1人1人と繋がる場をやっとるか？ちゃんと。",
      "価値提供って何や？",
      "違うよ。もう脳筋すぎるわ。",
      "1番儲けさせてくれる人じゃないんよ。",
      "これまで出会った人の中で1番大事にしてくれる人のランクインを取るにはどうしたらいいのかで全部生きるの。",
      "人が集まる人を近くに置くから組織になるだけや。",
      "集まらない人は遠くに置く。それだけ。",
      "じゃあ生き方変えて。",
      "ちょっと欲望の塊りになってるね。",
      "そこに気づけないと人って集まってこないよ。",
      "自分の主張をしすぎてしまっているから、世の中をもっと見るのよ。",
      "人の感情をもっと読み解くのよ。",
      "自分を中心にしてるからよ。",
      "自分の中でぐちゃぐちゃになってるだけやって。",
      "ちょっとね、素直な人じゃないなっていう判断をしてるの。",
      "私のやり方を貫きたい人だから。",
      "教える時にちょっと苦戦する人なのよ。",
      "自分のことを守りにかかるんよ。",
      "それができんから可愛がられないんよ。",
      "組織作れる人じゃない。今のところな。",
      "よほどの理解者がいない限りは内部で揉め事が起きやすい性質を持ってる。",
      "そのままのメッセージとそのスタイルだと、強いナンバー2、ナンバー3が生まれない。",
      "店舗展開は無理。",
      "組織にならんから。",
      "リーダーが生まれない性格してんの。",
      "なぜならリーダー殺してるから。",
      "事業増やしちゃダメなのよ。",
      "リーダーを作れるような性格してないから。",
      "私の話聞けって言って、リーダーの話聞かないで。",
      "世界観じゃないよ。好きやから集まるんやって。",
      "世界観ってさ、ずれた瞬間死ぬで。",
      "好きだから欲しいんよ。",

          { text: "『誰か来てください』とだけ投稿する。", ok: false, feedback: "具体性がないから方向定まらないんよ。誰に何をしてほしいのかがない告知は、ただ流れて終わる。" },
          { text: "体験会、無料サンプル、制作過程、事例紹介など、具体的に試せる接点を作る。", ok: true, feedback: "正解。興味がある人が自然に一歩進める接点を作れています。" },
          { text: "とにかく毎日違うことを発信する。", ok: false, feedback: "SNSやりすぎ病ね。毎日違うことを出しても、誰をどこに連れていくのかがなければ積み上がらないのよ。" }
        ],
        praise: "正解。目的に近い接点を増やすほど、次の行動につながります。"
      }
    ];

    let current = 0;
    let score = 0;
    let miss = 0;
    let trust = 50;
    let answered = false;
    let hintUsed = false;
    let currentChoices = [];
    let soundEnabled = true;
    let audioCtx = null;

    const questionEl = document.getElementById("question");
    const hintEl = document.getElementById("hint");
    const hintBtn = document.getElementById("hintBtn");
    const choicesEl = document.getElementById("choices");
    const messageEl = document.getElementById("message");
    const scoreEl = document.getElementById("score");
    const missEl = document.getElementById("miss");
    const trustEl = document.getElementById("trust");
    const progressEl = document.getElementById("progress");
    const sceneLabelEl = document.getElementById("sceneLabel");
    const mentorEl = document.getElementById("mentor");
    const panelEl = document.getElementById("panel");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const soundBtn = document.getElementById("soundBtn");

    function randomScold() {
      return scoldLines[Math.floor(Math.random() * scoldLines.length)];
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone({ frequency, startTime, duration, type = "sine", volume = 0.08 }) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      playTone({ frequency: 523.25, startTime: now, duration: 0.12, type: "triangle", volume: 0.07 });
      playTone({ frequency: 659.25, startTime: now + 0.11, duration: 0.12, type: "triangle", volume: 0.08 });
      playTone({ frequency: 783.99, startTime: now + 0.22, duration: 0.18, type: "triangle", volume: 0.09 });
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      playTone({ frequency: 220, startTime: now, duration: 0.18, type: "sawtooth", volume: 0.06 });
      playTone({ frequency: 164.81, startTime: now + 0.14, duration: 0.26, type: "sawtooth", volume: 0.07 });
    }

    function shuffleArray(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function render() {
      answered = false;
      hintUsed = false;
      const q = questions[current];
      currentChoices = shuffleArray(q.choices);
      sceneLabelEl.textContent = `相談 ${current + 1}`;
      questionEl.textContent = q.title;
      hintEl.textContent = q.hint;
      hintEl.style.display = "none";
      hintBtn.style.display = "block";
      hintBtn.disabled = false;
      hintBtn.classList.remove("used");
      hintBtn.textContent = "ヒントを見る（信頼度 -5）";
      choicesEl.innerHTML = "";
      messageEl.textContent = "選択肢はかなり紛らわしくなっています。言葉の綺麗さではなく、数字・相手・次の行動・確証まで見て選んでください。";
      messageEl.className = "message";
      currentChoices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = `${index + 1}. ${choice.text}`;
        btn.addEventListener("click", () => answer(choice, btn));
        choicesEl.appendChild(btn);
      });
      updateStats();
      nextBtn.textContent = current === questions.length - 1 ? "結果を見る" : "次の相談へ";
    }

    function answer(choice, btn) {
      if (answered) return;
      answered = true;
      hintBtn.disabled = true;
      const buttons = document.querySelectorAll(".choice");
      buttons.forEach(b => b.disabled = true);

      if (choice.ok) {
        playCorrectSound();
        score += 1;
        trust = Math.min(100, trust + 10);
        btn.classList.add("correct");
        const feedback = choice.feedback || questions[current].praise;
        messageEl.innerHTML = `<div class="praise">${feedback}</div>${hintUsed ? '<div>※ヒント使用：信頼度は少し下がっています。</div>' : ''}`;
      } else {
        playWrongSound();
        miss += 1;
        trust = Math.max(0, trust - 12);
        btn.classList.add("wrong");
        mentorEl.classList.remove("shake");
        panelEl.classList.remove("flash");
        void mentorEl.offsetWidth;
        mentorEl.classList.add("shake");
        panelEl.classList.add("flash");
        const feedback = choice.feedback || randomScold();
        messageEl.innerHTML = `<div class="scold">${feedback}</div><div>選んだ答えのどこがズレていたかを見て、目的・数字・相手・未来・次の行動まで考え直しましょう。</div>`;
      }
      updateStats();
    }

    function updateStats() {
      scoreEl.textContent = score;
      missEl.textContent = miss;
      trustEl.textContent = trust;
      progressEl.textContent = `${current + 1}/${questions.length}`;
    }

    function showResult() {
      choicesEl.innerHTML = "";
      hintEl.textContent = "最終フィードバック";
      sceneLabelEl.textContent = "結果発表";
      questionEl.textContent = "目的整理、終了。";
      let rank = "";
      let comment = "";
      if (score === questions.length) {
        rank = "Sランク：目的逆算の鬼";
        comment = "強い。行動の目的、数字、相手、未来、次の行動まで見えています。企画でも仕事でも創作でも組織づくりでも使える思考です。";
      } else if (score >= 21) {
        rank = "Aランク：かなり実行者モード";
        comment = "かなり良いです。あとは曖昧な言葉を数字と具体行動に変えれば、もっと強くなります。";
      } else if (score >= 15) {
        rank = "Bランク：まだ感覚に逃げがち";
        comment = "惜しい。行動はしているけど、目的・届け先・数字がぼやける場面があります。『何のため？』『誰に何を起こす？』を毎回確認しましょう。";
      } else if (score >= 8) {
        rank = "Cランク：SNSやりすぎ病注意";
        comment = "動く前に、目的・相手・数字・出口を決めましょう。手段から入ると、頑張っているのに進まない状態になります。";
      } else {
        rank = "喝ランク：課題を捉え直せ";
        comment = "まずは目的を一文で言う練習から。投稿、イベント、商品、営業、制作。それぞれを混ぜずに整理しましょう。";
      }
      messageEl.innerHTML = `<div class="praise">${rank}</div><div>${comment}</div>`;
      nextBtn.textContent = "もう一度プレイ";
    }

    nextBtn.addEventListener("click", () => {
      if (current === questions.length - 1) {
        if (sceneLabelEl.textContent === "結果発表") {
          reset();
        } else {
          showResult();
        }
        return;
      }
      current += 1;
      render();
    });

    resetBtn.addEventListener("click", reset);

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "サウンド ON" : "サウンド OFF";
      soundBtn.classList.toggle("off", !soundEnabled);
      if (soundEnabled) {
        playTone({ frequency: 659.25, startTime: getAudioContext().currentTime, duration: 0.08, type: "triangle", volume: 0.05 });
      }
    });

    function reset() {
      current = 0;
      score = 0;
      miss = 0;
      trust = 50;
      render();
    }

    hintBtn.addEventListener("click", () => {
      if (answered || hintUsed) return;
      hintUsed = true;
      trust = Math.max(0, trust - 5);
      hintEl.style.display = "block";
      hintBtn.textContent = "ヒント使用済み";
      hintBtn.classList.add("used");
      hintBtn.disabled = true;
      updateStats();
    });

    render();
  </script>
</body>
</html>
